name: Buat APK Otomatis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Kompilasi Flutter & Muat Situs Jadwal Asli
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Konfigurasi Proyek, WebView & Integrasi AdMob
      run: |
        # Buat kerangka proyek Flutter
        flutter create . --org com.annawa --project-name jadwal_annawa --platforms android

        # Pastikan folder assets ada dan salin file web serta database asli Ustadz
        mkdir -p android/app/src/main/assets
        cp index.html android/app/src/main/assets/index.html
        cp DATABASE.xlsx android/app/src/main/assets/DATABASE.xlsx 2>/dev/null || true

        # Tambahkan dependensi webview_flutter dan google_mobile_ads di pubspec.yaml
        sed -i '/dependencies:/a \  webview_flutter: ^4.7.0\n  google_mobile_ads: ^5.1.0' pubspec.yaml
        flutter pub get

        # Paksa set minSdk langsung ke 21 dengan menimpa baris defaultConfig di android/app/build.gradle
        sed -i 's/minSdk.*/minSdk 21/g' android/app/build.gradle
        sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle

        # Sisipkan App ID AdMob ke AndroidManifest.xml
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3143680001009952~1205948994"/>\n</application>|g' "$MANIFEST_PATH"
        fi

        # Timpa file lib/main.dart agar langsung memuat file index.html offline milik pesantren
        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:webview_flutter/webview_flutter.dart';

        void main() {
          runApp(const MaterialApp(
            debugShowCheckedModeBanner: false,
            home: JadwalApp(),
          ));
        }

        class JadwalApp extends StatefulWidget {
          const JadwalApp({super.key});

          @override
          State<JadwalApp> createState() => _JadwalAppState();
        }

        class _JadwalAppState extends State<JadwalApp> {
          late final WebViewController controller;

          @override
          void initState() {
            super.initState();
            controller = WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..loadFlutterAsset('assets/index.html');
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              body: SafeArea(
                child: WebViewWidget(controller: controller),
              ),
            );
          }
        }
        EOF

        flutter build apk --debug

    - name: Unggah APK Asli Jadwal An-Nawa
      uses: actions/upload-artifact@v4
      with:
        name: Jadwal-AnNawa-Asli-Debug
        path: build/app/outputs/flutter-apk/app-debug.apk
