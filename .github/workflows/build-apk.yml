name: Buat APK Otomatis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Siapkan Struktur Proyek Android & WebView
      run: |
        # Buat direktori standar proyek Android
        mkdir -p app/src/main/assets app/src/main/java/com/annawa/jadwal app/src/main/res/mipmap-hdpi
        
        # Salin file web utama ke folder assets aplikasi
        cp index.html app/src/main/assets/
        cp DATABASE.xlsx app/src/main/assets/ 2>/dev/null || true

        # 1. Buat AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.annawa.jadwal">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="Jadwal An-Nawa"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. Buat MainActivity.java
        cat << 'EOF' > app/src/main/java/com/annawa/jadwal/MainActivity.java
        package com.annawa.jadwal;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        # 3. Konfigurasi Gradle Build
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "Jadwal AnNawa"
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.annawa.jadwal'
            compileSdk 33
            defaultConfig {
                applicationId "com.annawa.jadwal"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        gradle wrapper

    - name: Kompilasi APK Debug
      run: ./gradlew assembleDebug

    - name: Unggah File APK Matang
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Jadwal-AnNawa-APK
        path: app/build/outputs/apk/debug/*.apk
