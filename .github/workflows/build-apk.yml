name: Buat APK Otomatis

on:
  push:
    branches: [ main ]  # Berjalan otomatis setiap ada push ke branch main
  workflow_dispatch:    # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Konversi Web ke APK (WebView Wrapper)
      uses: natario1/webview-android-action@v1
      with:
        # Tautan web Ustadz yang sudah online di GitHub Pages
        url: 'https://gunan-awa.github.io/jadwal/'
        app_name: 'Jadwal An-Nawa'
        package_name: 'com.annawa.jadwal'

    - name: Unggah Hasil Berkas APK
      uses: actions/upload-artifact@v4
      with:
        name: Aplikasi-Jadwal-AnNawa
        path: app/build/outputs/apk/release/*.apk
