name: Buat APK An-Nawa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Rangkai dan Build APK Android
      run: |
        mkdir -p app/src/main/java/com/annawa/jadwal app/src/main/res/values app/src/main/res/mipmap-hdpi

        # Salin logo pesantren sebagai ikon aplikasi
        cp logo.png app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true

        # Tema NoTitleBar agar bersih tanpa bilah hitam di atas
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="AppTheme" parent="android:Theme.NoTitleBar">
                <item name="android:windowFullscreen">false</item>
            </style>
        </resources>
        EOF

        # Manifest Android
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.annawa.jadwal">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:label="Jadwal An-Nawa"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:usesCleartextTraffic="true">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:theme="@style/AppTheme">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity.java (WebView Online/Offline, Print & PDF Support)
        cat << 'EOF' > app/src/main/java/com/annawa/jadwal/MainActivity.java
        package com.annawa.jadwal;
        import android.app.Activity;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.DownloadListener;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                settings.setAllowFileAccess(true);
                settings.setJavaScriptCanOpenWindowsAutomatically(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.setWebChromeClient(new WebChromeClient());

                webView.setDownloadListener(new DownloadListener() {
                    @Override
                    public void downloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                        Intent intent = new Intent(Intent.ACTION_VIEW);
                        intent.setData(Uri.parse(url));
                        try {
                            startActivity(intent);
                        } catch (Exception e) {
                            Toast.makeText(MainActivity.this, "Gagal mengunduh file", Toast.LENGTH_SHORT).show();
                        }
                    }
                });

                webView.loadUrl("https://gunan-awa.github.io/jadwal/");
                setContentView(webView);
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # Gradle Config Minimalis
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "Jadwal AnNawa"
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.annawa.jadwal'
            compileSdk 33
            defaultConfig {
                applicationId "com.annawa.jadwal"
                minSdk 21
                targetSdk 33
                versionCode 11
                versionName "2.0"
            }
        }
        EOF

        # Build langsung tanpa wrapper yang bikin macet di start
        gradle assembleDebug --no-daemon

    - name: Unggah APK An-Nawa
      uses: actions/upload-artifact@v4
      with:
        name: Jadwal-AnNawa-Ringan
        path: app/build/outputs/apk/debug/*.apk
