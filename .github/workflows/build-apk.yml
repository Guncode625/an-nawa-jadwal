name: Buat APK Otomatis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Validasi Berkas Web
      run: |
        echo "Memeriksa kelengkapan file web..."
        ls -la

    - name: Buat Arsip Web untuk WebView
      run: |
        mkdir -p android-app/assets
        cp index.html android-app/assets/ 2>/dev/null || true
        cp DATABASE.xlsx android-app/assets/ 2>/dev/null || true

    - name: Simpan Artefak Web
      uses: actions/upload-artifact@v4
      with:
        name: Berkas-Web-AnNawa
        path: android-app/assets/
