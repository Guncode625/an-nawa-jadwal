name: Buat APK Ringan (Gradle Native)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Rangkai Struktur Proyek & Build APK
      run: |
        # Buat struktur direktori Android standar
        mkdir -p app/src/main/assets app/src/main/java/com/annawa/jadwal app/src/main/res/values app/src/main/res/mipmap

        # Salin file web utama dan database ke assets
        cp index.html app/src/main/assets/
        cp DATABASE.xlsx app/src/main/assets/ 2>/dev/null || true

        # Buat folder khusus ikon mipmap Android
        mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

        # Salin dan sesuaikan logo.png milik pesantren agar menjadi ikon aplikasi
        cp logo.png app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
        cp logo.png app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
        cp logo.png app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
        cp logo.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
        cp logo.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true

        # 1. AndroidManifest.xml (Termasuk App ID AdMob & Icon)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.annawa.jadwal">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="Jadwal An-Nawa"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:usesCleartextTraffic="true">
                
                <!-- AdMob App ID -->
                <meta-data
                    android:name="com.google.android.gms.ads.APPLICATION_ID"
                    android:value="ca-app-pub-3143680001009952~1205948994"/>

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. MainActivity.java (WebView Lokal berukuran sangat kecil dengan izin akses berkas penuh)
        cat << 'EOF' > app/src/main/java/com/annawa/jadwal/MainActivity.java
        package com.annawa.jadwal;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setAllowFileAccessFromFileURLs(true);
                settings.setAllowUniversalAccessFromFileURLs(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # 3. Konfigurasi Gradle murni
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "Jadwal AnNawa"
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.annawa.jadwal'
            compileSdk 34
            defaultConfig {
                applicationId "com.annawa.jadwal"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        # Langsung jalankan gradle
        gradle assembleDebug --no-daemon

    - name: Unggah APK Ringan An-Nawa
      uses: actions/upload-artifact@v4
      with:
        name: Jadwal-AnNawa-Ringan
        path: app/build/outputs/apk/debug/*.apk
