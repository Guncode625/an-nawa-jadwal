name: Buat APK Otomatis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Siapkan Struktur & Kompilasi APK Gradle
      run: |
        mkdir -p app/src/main/assets app/src/main/java/com/annawa/jadwal app/src/main/res/values app/src/main/res/mipmap
        
        # Salin file web dan database utama ke assets Android
        cp index.html app/src/main/assets/
        cp DATABASE.xlsx app/src/main/assets/ 2>/dev/null || true

        # 1. AndroidManifest.xml (Termasuk App ID AdMob)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.annawa.jadwal">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="Jadwal An-Nawa"
                android:usesCleartextTraffic="true"
                android:icon="@mipmap/ic_launcher">
                
                <!-- AdMob App ID -->
                <meta-data
                    android:name="com.google.android.gms.ads.APPLICATION_ID"
                    android:value="ca-app-pub-3143680001009952~1205948994"/>

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 2. MainActivity.java (WebView untuk memuat index.html lokal)
        cat << 'EOF' > app/src/main/java/com/annawa/jadwal/MainActivity.java
        package com.annawa.jadwal;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # 3. strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Jadwal An-Nawa</string>
        </resources>
        EOF

        # 4. Konfigurasi Gradle Root
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = "Jadwal AnNawa"
        EOF

        # 5. Konfigurasi app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.annawa.jadwal'
            compileSdk 33
            defaultConfig {
                applicationId "com.annawa.jadwal"
                minSdk 21
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

        gradle wrapper --gradle-version 7.5

    - name: Build APK via Gradle
      run: |
        yes | sdkmanager --licenses || true
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Unggah Artefak APK Ber-AdMob
      uses: actions/upload-artifact@v4
      with:
        name: Jadwal-AnNawa-AdMob-Debug
        path: app/build/outputs/apk/debug/*.apk
