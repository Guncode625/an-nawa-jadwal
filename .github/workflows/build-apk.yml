name: Buat APK Otomatis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repositori
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buat Arsip WebView Siap Build
      run: |
        mkdir -p www
        cp index.html www/
        cp DATABASE.xlsx www/ 2>/dev/null || true

    - name: Kompilasi Otomatis via Gradle Runner
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Bangun APK Android
      run: |
        flutter create . --org com.annawa --project-name jadwal_app --platforms android
        cp index.html android/app/src/main/assets/index.html 2>/dev/null || true
        flutter build apk --debug

    - name: Unggah Berkas APK Hasil Build
      uses: actions/upload-artifact@v4
      with:
        name: Jadwal-AnNawa-Debug.apk
        path: build/app/outputs/flutter-apk/app-debug.apk
